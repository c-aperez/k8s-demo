apiVersion: apps/v1  # Especifica la versión de la API de Kubernetes para el recurso "Deployment".
kind: Deployment     # Indica que el recurso que se va a crear es un Deployment.

metadata:
  namespace: dcsarapp             # Namespace en el que se desplegará este Deployment.
  name: dcsar-basic-landing-page  # Nombre del Deployment.

spec:
  revisionHistoryLimit: 1         # Limita el historial de revisiones del Deployment a 1 (menos consumo de recursos).
  replicas: 1                     # Número de réplicas (pods) deseadas. Se mantendrán 2 instancias corriendo.
  strategy:
    type: RollingUpdate           # Estrategia de actualización: reemplaza pods de manera progresiva.
    rollingUpdate:
      maxSurge: 2                 # Permite que hasta 2 pods adicionales se creen temporalmente durante la actualización.
      maxUnavailable: 0           # No permite que ningún pod quede no disponible durante la actualización.

  selector:
    matchLabels:
      service: dcsar-basic-landing-page  # Selector para identificar los pods que serán administrados por este Deployment.

  template:  # Plantilla del pod: define cómo deben ser los pods que crea el Deployment.
    metadata:
      labels:
        service: dcsar-basic-landing-page  # Etiqueta que permite al selector del Deployment encontrar estos pods.

    spec:
      containers:
        - image: "dcsarapp:v1"             # Imagen del contenedor que se ejecutará. Puede estar en un registro local o remoto.
          imagePullPolicy: IfNotPresent    # Solo descarga la imagen si no está presente en el nodo.
          name: dcsar-basic-landing-page   # Nombre del contenedor (usado dentro del pod).
          ports:
            - containerPort: 80            # Expone el puerto 80 del contenedor (normalmente HTTP).
          resources:                       # Define recursos mínimos (requests) y máximos (limits) para el contenedor.
            requests:
              memory: "256Mi"              # Memoria mínima garantizada para el contenedor.
              cpu: "0.2"                   # CPU mínima garantizada (0.5 cores).
            limits:
              memory: "256Mi"              # Memoria máxima permitida.
              cpu: "0.2"                   # CPU máxima permitida.
          tty: true                        # Habilita el soporte de TTY (útil si se accede con `kubectl exec -it`).

      restartPolicy: Always                # Política de reinicio del pod: siempre reinicia si el contenedor falla.

status: {}  # Esta sección es manejada por Kubernetes automáticamente para reflejar el estado actual del Deployment.
